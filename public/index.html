<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الوصية</title>
<meta name="description" content="لعبة للقعدة: اكتب وصيتك، اكسر الخزنة، وماتبقاش أول واحد يخرج.">
<meta name="theme-color" content="#5b21c4">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: phone-first game screen. Sticky HUD → big phase banner → one focused action panel → notes/log tabs → player avatars.
   Look: cartoon "sticker" game UI. Party-purple ground with confetti dots, cream panels with thick ink outlines and hard drop shadows, candy colors. */
:root{
  --bg:#5b21c4; --bg-hi:#8b3dff; --bg-lo:#3a0f8f;
  --panel:#fffaf0; --panel2:#f3eaff; --ink:#24104a; --on-bg:#ffffff;
  --yellow:#ffd23f; --orange:#ff9a3c; --pink:#ff4f8b; --teal:#22dcc0; --mint:#57e39a; --sky:#4d8bff;
  --red:#ff4d5e; --blue:#3f7bff; --green:#12b76a;
  --font:"Baloo Bhaijaan 2","Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --line:3px solid var(--ink); --drop:0 5px 0 var(--ink);
  color-scheme:light;
}
html,body{min-height:100%;background:var(--bg);color:var(--on-bg)}
body{font-family:var(--font);font-weight:500;font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 48px;
  background:
   radial-gradient(circle at 12% 18%, rgba(255,210,63,.35) 0 3px, transparent 4px) 0 0/90px 90px,
   radial-gradient(circle at 70% 60%, rgba(255,79,139,.35) 0 3px, transparent 4px) 0 0/110px 110px,
   radial-gradient(circle at 40% 80%, rgba(34,220,192,.35) 0 2.5px, transparent 3.5px) 0 0/70px 70px,
   radial-gradient(120% 70% at 50% -10%, var(--bg-hi), var(--bg) 55%, var(--bg-lo));
  background-attachment:fixed}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
#app{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
p{margin:0}
.muted{opacity:.72} .small{font-size:.86rem}
.num,.delta,.blk,.tot,.ansb{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.center{text-align:center;align-items:center;justify-content:center}
.sec{background:var(--panel);color:var(--ink);border:var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 6px 0 var(--ink)}
.sec-t{font-weight:800;font-size:1.25rem;line-height:1.2;display:flex;align-items:center;gap:8px}
.lbl{font-size:.8rem;font-weight:700;opacity:.65;letter-spacing:.02em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;padding:11px 18px;font-weight:800;background:#fff;color:var(--ink);border:var(--line);box-shadow:var(--drop);transition:transform .08s ease, box-shadow .08s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.gold{background:var(--yellow)}
.btn.red{background:var(--pink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:inherit;opacity:.85}
.btn.ghost:active{transform:none}
.btn.block{width:100%}
.btn.lg{font-size:1.2rem;padding:14px 20px;border-radius:20px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 2px 0 var(--ink)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;opacity:.7;padding:2px 0;align-self:flex-start}
input[type=text]{width:100%;min-width:0;background:#fff;border:var(--line);border-radius:18px;padding:12px 16px;color:var(--ink);font:inherit;font-weight:700;font-size:1.1rem}
input[type=text]::placeholder{color:var(--ink);opacity:.38}
input[type=text]:focus{outline:none;box-shadow:0 0 0 4px var(--yellow)}
.err{background:var(--pink);color:#fff;border:var(--line);border-radius:14px;padding:8px 12px;font-weight:700}

/* logo */
.logo{display:flex;flex-direction:column;align-items:center;gap:0}
.logo svg{width:150px;height:auto;filter:drop-shadow(0 6px 0 var(--ink));animation:bob 3.5s ease-in-out infinite}
.logo .word{font-weight:800;font-size:4.6rem;line-height:1;color:var(--yellow);text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),0 8px 0 var(--ink);margin-top:-6px}
.logo .latin{font-weight:800;letter-spacing:.35em;font-size:.8rem;background:var(--ink);color:var(--yellow);padding:3px 12px 2px;border-radius:999px;margin-top:8px}
.logo.sm svg{width:74px} .logo.sm .word{font-size:2.4rem;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),0 5px 0 var(--ink)}
.seal{transform-origin:162px 112px;animation:wob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes wob{50%{transform:rotate(12deg)}}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:10px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:color-mix(in srgb,var(--bg-lo) 82%,transparent);backdrop-filter:blur(10px);border-bottom:3px solid var(--ink)}
.pill{display:inline-block;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:800}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid var(--ink)}
.dots i.on{background:var(--yellow)} .dots i.now{background:#fff;transform:scale(1.25)}
.ring{position:relative;width:58px;height:58px;display:grid;place-items:center;background:var(--panel);border:var(--line);border-radius:50%;box-shadow:0 4px 0 var(--ink)}
.ring svg{position:absolute;inset:3px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:#e8dcff} .ring .fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring.low .fg{stroke:var(--pink)} .ring.low{animation:shake .5s ease-in-out infinite}
.ring span{font-weight:800;font-size:1.3rem;color:var(--ink);position:relative}
@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.hud-r{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.score{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.score b{font-size:1.5rem;font-weight:800;color:var(--yellow);text-shadow:0 2px 0 var(--ink)}
.score small{font-size:.75rem;opacity:.8}
.qbtn{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--ink);border:var(--line);font-weight:800;box-shadow:0 3px 0 var(--ink)}

/* banner */
.banner{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.banner h1{font-size:2.1rem;line-height:1.15;text-shadow:0 3px 0 var(--ink)}
.banner p{font-size:1.02rem;opacity:.9}

/* avatars */
.av{--av:#888;position:relative;width:44px;height:44px;border-radius:50%;background:var(--av);color:var(--ink);display:inline-grid;place-items:center;font-weight:800;font-size:1.15rem;flex:none;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.av.lg{width:66px;height:66px;font-size:1.7rem}
.av.sm{width:32px;height:32px;font-size:.85rem;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.av i{position:absolute;bottom:-6px;inset-inline-end:-8px;font-style:normal;font-size:.8rem;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 3px;line-height:1.3}
.av.dim{filter:grayscale(1);opacity:.6}
.av.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.people{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.person{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;font-size:.8rem;font-weight:700}
.person .nm{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.people .person.me .nm{color:var(--yellow)}
.pick-person{border-radius:18px;padding:10px 4px 8px;border:3px solid transparent;background:var(--panel2)}
.pick-person.sel{border-color:var(--ink);background:var(--yellow);box-shadow:0 4px 0 var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}

/* cards */
.hand{display:flex;gap:4px;align-items:center}
.flip{animation:flip .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes flip{from{transform:rotateY(90deg) scale(.6)}to{transform:none}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:12px}
.tgrid .card{width:100%;height:auto;aspect-ratio:5/7}

/* vault */
.vaultbox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.vault{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98a,var(--yellow) 45%,var(--orange));position:relative;display:grid;place-items:center;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.vault::before{content:"";position:absolute;inset:10px;border-radius:50%;border:3px dashed var(--ink);opacity:.35}
.vault .slots{display:flex;gap:4px;position:relative}
.vault .slot{width:22px;height:30px;border-radius:6px;background:var(--ink);color:var(--yellow);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.vault.small{width:90px;height:90px}
.vault.spin::before{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hints{display:flex;flex-direction:column;gap:6px;min-width:0}
.hint{background:#fff3c4;border:2px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:.92rem;font-weight:700}
.hint.gold{background:var(--yellow);border-width:3px;box-shadow:0 3px 0 var(--ink)}
.hint.new{animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* action tiles */
.tiles{display:flex;flex-direction:column;gap:12px}
.tile{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;text-align:start;padding:12px;border-radius:24px;background:var(--panel);color:var(--ink);border:var(--line);box-shadow:0 6px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.tile .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.8rem;border:3px solid var(--ink)}
.tile:nth-child(1) .ic{background:var(--teal)} .tile:nth-child(2) .ic{background:var(--sky)} .tile:nth-child(3) .ic{background:var(--yellow)}
.tile b{font-weight:800;font-size:1.35rem;display:block;line-height:1.15}
.tile span{font-size:.9rem;opacity:.72}
.tile .arrow{font-size:1.6rem;font-weight:800;opacity:.5}
.tile.open{background:linear-gradient(90deg,#fff3c4,var(--panel))}
[dir=rtl] .tile .arrow{transform:scaleX(-1)}
.tiles > .btn.ghost{color:var(--on-bg)}

/* lie switch */
.lie{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;border:3px dashed rgba(255,255,255,.6);color:var(--on-bg);text-align:start;width:100%}
.lie .tg{margin-inline-start:auto;width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.3);border:3px solid var(--ink);position:relative;flex:none}
.lie .tg::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:inset-inline-start .2s}
.lie.on{border:3px solid var(--ink);background:var(--pink);box-shadow:0 5px 0 var(--ink)}
.lie.on .tg{background:var(--yellow)} .lie.on .tg::after{inset-inline-start:24px}
.lie .muted{opacity:.85}

/* segmented */
.seg{display:flex;background:var(--panel2);border:2px solid var(--ink);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:7px 6px;border-radius:12px;font-weight:800;font-size:.95rem;opacity:.6}
.seg button.on{background:#fff;border:2px solid var(--ink);opacity:1;box-shadow:0 2px 0 var(--ink)}
.badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:var(--pink);color:#fff;font-size:.75rem;font-weight:800}

/* notes */
.notes{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.slots3{display:flex;gap:10px;justify-content:center}
.slot3{width:58px;height:82px;border-radius:14px;border:3px dashed var(--ink);opacity:.4;display:grid;place-items:center;font-size:1.5rem;font-weight:800}

/* log */
.log{display:flex;flex-direction:column;gap:8px}
.bub{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:18px;padding:10px 12px;border:2px solid var(--ink)}
.bub .q{font-size:.95rem;min-width:0;font-weight:600}
.bub .q b{font-weight:800}
.ansb{min-width:48px;text-align:center;padding:4px 10px;border-radius:14px;font-weight:800;font-size:1.1rem;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.ansb.y{background:var(--mint)} .ansb.n{background:var(--pink);color:#fff} .ansb.v{background:var(--yellow)}
.turnlbl{font-size:.8rem;font-weight:800;opacity:.55;margin-top:4px}
.event{background:var(--yellow);border:2px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:800}

/* waiting */
.waitbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:8px 0}
.bigemoji{font-size:3.2rem;line-height:1;animation:bob 2s ease-in-out infinite}

/* results */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;text-align:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .blk{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-weight:800;font-size:1.7rem;color:var(--ink);border:var(--line)}
.pod.p1 .blk{height:100px;background:var(--yellow)}
.pod.p2 .blk{height:72px;background:var(--teal)}
.pod.p3 .blk{height:54px;background:var(--orange)}
.pod .nm{font-weight:800;font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:20px;background:var(--panel);color:var(--ink);border:var(--line);box-shadow:0 4px 0 var(--ink)}
.sec .lrow{box-shadow:none;border-width:2px;background:var(--panel2)}
.lrow.danger{background:#ffd6e4}
.lrow.me{background:#fff3c4}
.delta{font-weight:800;font-size:.95rem;padding:2px 9px;border-radius:12px;border:2px solid var(--ink)}
.delta.p{background:var(--mint)} .delta.m{background:var(--pink);color:#fff} .delta.z{background:#fff}
.tot{font-weight:800;font-size:1.3rem;min-width:2.5ch;text-align:end}
.tags{font-size:.8rem;opacity:.65;font-weight:600}

/* will */
.scroll{background:#fff1c9;color:var(--ink);border:var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 var(--ink);position:relative}
.scroll::before{content:"";position:absolute;top:-10px;inset-inline:14px;height:16px;border-radius:10px;background:var(--yellow);border:var(--line)}
.scroll h3{font-size:1.35rem;margin-top:4px}
.scroll .cl{display:flex;gap:8px;align-items:center;background:rgba(36,16,74,.07);border-radius:14px;padding:8px 10px;font-weight:700}
.scroll .cl button{margin-inline-start:auto;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-weight:800;flex:none}
.scroll .empty{opacity:.55;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{padding:8px 12px;border-radius:16px;background:#fff;border:2px solid var(--ink);font-weight:700;font-size:.95rem;text-align:start;box-shadow:0 3px 0 var(--ink)}
.chipb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chipb.sel{background:var(--yellow)}
.chipb:disabled{opacity:.35;box-shadow:none}
.saved{align-self:center;background:var(--mint);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:800;font-size:.9rem;text-align:center}

/* court + wills */
.stage{border-radius:28px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;background:radial-gradient(100% 80% at 50% 0%,#fff3c4,var(--panel));color:var(--ink);border:var(--line);box-shadow:0 6px 0 var(--ink)}
.stage .big{font-size:3.6rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
.defs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.def{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:22px;border:3px solid transparent;min-width:92px;font-weight:800}
button.def{background:var(--panel2)}
.def.sel{border-color:var(--ink);background:var(--yellow);box-shadow:0 4px 0 var(--ink)}
.will-out{background:#fff1c9;color:var(--ink);border:var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px;animation:rise .55s cubic-bezier(.3,1.5,.5,1) both;box-shadow:0 6px 0 var(--ink)}
.will-out h3{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.will-out .res{display:flex;gap:10px;align-items:flex-start;background:rgba(36,16,74,.07);border-radius:14px;padding:10px;font-weight:700}
.will-out .res .mk{font-weight:800;font-size:1.2rem}
.will-out .ok{color:#0c8a4f} .will-out .no{color:#d0233a}
.will-out .sub{font-size:.88rem;opacity:.75;font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.9)}}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:18px}
.hero p{font-size:1.15rem;max-width:30ch;font-weight:600}
.or{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:700;opacity:.6}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.25}
.codebig{display:flex;gap:8px;justify-content:center;direction:ltr}
.codebig span{width:56px;height:68px;border-radius:16px;background:#fff;border:var(--line);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;font-size:2.2rem;font-weight:800;color:var(--ink)}
.codebig span:nth-child(odd){transform:rotate(-4deg)} .codebig span:nth-child(even){transform:rotate(3deg);background:var(--yellow)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-top:12px;font-weight:700}
.topbar .btn.ghost{color:var(--on-bg)}
#app > .spread .btn.ghost{color:var(--on-bg)}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,6,50,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.ovc{width:100%;max-width:400px;background:var(--panel);color:var(--ink);border:var(--line);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:center;animation:rise .35s cubic-bezier(.3,1.5,.5,1);box-shadow:0 8px 0 var(--ink)}
.ovc .big{font-size:3.8rem;line-height:1;width:96px;height:96px;margin-inline:auto;display:grid;place-items:center;border-radius:50%;background:var(--yellow);border:var(--line)}
.ovc h2{font-size:1.8rem}
.ovc p{font-size:1.05rem;font-weight:600;opacity:.8}
.sdots{display:flex;gap:6px;justify-content:center}
.sdots i{width:10px;height:10px;border-radius:50%;background:#e2d6f7;border:2px solid var(--ink)} .sdots i.on{background:var(--pink);width:24px;border-radius:6px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-20px;width:11px;height:15px;border-radius:3px;border:2px solid var(--ink);animation:fall 3.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.peekbar{height:10px;border-radius:6px;background:var(--teal);border:2px solid var(--ink);animation:drain 3s linear forwards;width:100%}
@keyframes drain{to{width:0}}

.steps{display:flex;gap:8px}
.steps span{flex:1;text-align:center;font-weight:800;font-size:.85rem;padding:5px;border-radius:12px;background:var(--panel2);opacity:.55}

function applyLang(){ document.documentElement.lang = lang; document.documentElement.dir = lang==='ar'?'rtl':'ltr'; document.title = t('title'); }

/* ============ NETWORK (server) ============ */
// The server runs the game. We send our inputs over a WebSocket; it sends back the state (with only OUR private info).
const canNet = typeof WebSocket !== 'undefined' && /^https?:$/.test(location.protocol);
const NET = { ws:null, code:null, want:false, retry:0, timer:null };
function wsURL(code){ return (location.protocol==='https:'?'wss://':'ws://') + location.host + '/ws?code=' + code; }
function netOpen(code, first, onReply){
  netClose(false);
  NET.code = code; NET.want = true;
  let ws; try{ ws = new WebSocket(wsURL(code)); }catch(e){ onReply && onReply({t:'err', e:'net'}); return; }
  NET.ws = ws; let replied = false;
  ws.onopen = ()=>{ NET.retry = 0; ws.send(JSON.stringify(first)); };
  ws.onmessage = ev=>{ let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.t==='ok' || m.t==='err'){ if(!replied){ replied = true; onReply && onReply(m); } if(m.t==='ok') sendInput(true); return; }
    if(m.t==='state' && !solo) recvState(m.S);
    if(m.t==='kicked'){ NET.want = false; store.set('wsy_room',''); S = null; U.screen='home'; render(); }
  };
  ws.onclose = ()=>{ if(NET.ws!==ws) return; NET.ws = null;
    if(!replied){ replied = true; onReply && onReply({t:'err', e:'net'}); return; }
    if(NET.want && !solo){ clearTimeout(NET.timer); NET.timer = setTimeout(()=>{ if(NET.want) netOpen(NET.code, {t:'join', pid:me, name:U.name}, r=>{ if(r.t==='err' && r.e!=='net'){ NET.want=false; store.set('wsy_room',''); S=null; U.screen='home'; U.err=t('noHost'); render(); } }); }, Math.min(8000, 1000 * (++NET.retry))); }
  };
}
function netClose(bye){ NET.want = false; clearTimeout(NET.timer); const ws = NET.ws; NET.ws = null; if(ws){ try{ if(bye && ws.readyState===1) ws.send(JSON.stringify({t:'leave'})); ws.close(); }catch(e){} } }
function netSend(obj){ const ws = NET.ws; if(ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }
let sendTimer = null;
function sendInput(now){
  if(solo) return;
  clearTimeout(sendTimer);
  const go = ()=> netSend({t:'input', d:{...IN, n:U.name}});
  if(now) go(); else sendTimer = setTimeout(go, 40);
}
function setIn(patch){ for(const k in patch){ if(patch[k]===null) delete IN[k]; else IN[k]=patch[k]; } if(host) host.myInput = {...IN}; sendInput(); }
function cmd(c, v){ if(!solo) netSend({t:'cmd', c, v}); }
/* open public rooms: ask the server every few seconds while you're on the home screen */
async function pollRooms(){
  if(!canNet || U.screen!=='home') return;
  try{ const r = await fetch('/api/rooms', {cache:'no-store'}); if(r.ok){ const list = await r.json(); U.rooms = Array.isArray(list) ? list.slice(0,30) : []; U.lobbyOk = true; if(U.screen==='home') render(); } }catch(e){}
}
if(canNet){ setInterval(pollRooms, 6000); setTimeout(pollRooms, 300); }
/* came back after closing the page? rejoin your room */
setTimeout(()=>{ const code = store.get('wsy_room'); if(canNet && code && U.name){ U.code = code; U.screen = 'wait'; render(); netOpen(code, {t:'join', pid:me, name:U.name}, r=>{ if(r.t==='err'){ store.set('wsy_room',''); U.screen='home'; render(); } }); } }, 50);

function recvState(ns){
  if(!ns) return;
  if(S && ns.v === S.v && ns.h === S.h) return;
  const prevK = S?.k;
  S = ns; U.dlLocal = Date.now() + (ns.rem||0);
  if(prevK !== ns.k){ U.phaseDur = Math.max(1, ns.rem||1); onPhaseChange(); }
  const ar = ns.pv?.[me]?.ar || [];
  if(ns.r !== U.arR){ U.arR = ns.r; U.arSeen = 0; }
  for(let k=U.arSeen; k<ar.length; k++){ const a = ar[k]; if(a[0]==='sa2r' && U.notes[a[2]]!==2){ U.notes[a[2]]=1; U.seen[a[2]]=1; } if(a[0]==='tabdeel'){ U.notes[a[1]]=1; } }
  U.arSeen = ar.length;
  U.screen = 'game';
  render();
}
function onPhaseChange(){
  if(!((['open','confirm'].includes(U.mode) || String(U.mode).startsWith('ab:')) && ['turn','reveal'].includes(S.ph))) U.mode = null;
  if(S.ph==='ans'){ U.lieMode = false; if(S.pend && S.pend.t===me){ try{ navigator.vibrate && navigator.vibrate([80,60,80]); }catch(_){} } }
  if(S.ph==='turn'){ U.selPeek=null; U.askT=null; U.askQ=null; if(S.cur===me){ try{ navigator.vibrate && navigator.vibrate(120); }catch(_){} } }
  if(S.r !== U.notesR){ U.notes = {}; U.seen = {}; U.pick = []; U.mode = null; U.sheet = null; U.notesR = S.r; U.seenHints = 0; setIn({g:null, o:null, a:null, ac:null}); }
  if(S.ph==='reveal'){ const pk = S.pv?.[me]?.pk; if(pk && pk[2]===S.tn){ U.peekUntil = Date.now()+3000; setTimeout(render, 3100); if(U.notes[pk[1]]!==2) U.notes[pk[1]]=1; U.seen[pk[1]]=1; } }
  if(S.ph==='over'){ U.confetti = true; setTimeout(()=>{U.confetti=false; render();}, 3500); }
  if(S.ph==='lobby' || S.ph==='will'){ if(S.ph==='lobby') U.draft = {c:[], x:''}; setIn({wd:null}); }
  try{ window.scrollTo({top:0}); }catch(_){}
}
function startHostLoop(){
  clearInterval(hostTimer);
  hostTimer = setInterval(()=>{ host.tick(); const ns = host.pub(); if(!S || ns.v !== S.v){ recvState(ns); } }, 200);
}
function need(){ U.name = (U.name||'').trim(); if(!U.name){ U.err = t('needName'); render(); return false; } store.set('wsy_name', U.name); return true; }
function newCode(){ return Array.from({length:4},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join(''); }
function createRoom(tries){
  if(!need()) return;
  if(!canNet){ U.err = t('noServer'); render(); return; }
  tries = tries || 0; IN = {};
  const code = newCode();
  netOpen(code, {t:'create', pid:me, name:U.name, pub:U.pubRoom}, r=>{
    if(r.t==='err' && r.e==='exists' && tries < 5) return createRoom(tries+1);
    if(r.t!=='ok'){ netClose(false); U.err = t('noServer'); render(); return; }
    U.code = code; store.set('wsy_room', code); U.err=''; if(!S) U.screen='wait'; render();
  });
}
function joinRoom(){
  if(!need()) return;
  const code = (U.code||'').trim().toUpperCase(); if(!/^[A-Z]{4}$/.test(code)){ U.err = t('noHost'); render(); return; }
  if(!canNet){ U.err = t('noServer'); render(); return; }
  IN = {};
  netOpen(code, {t:'join', pid:me, name:U.name}, r=>{
    if(r.t!=='ok'){ netClose(false); U.err = r.e==='started' ? t('errStarted') : r.e==='full' ? t('errFull') : r.e==='net' ? t('noServer') : t('noHost'); U.screen='home'; render(); return; }
    U.code = code; store.set('wsy_room', code); U.err=''; if(!S) U.screen='wait'; render();
  });
}
function botNames(){ return lang==='ar' ? ['منى','عمر','كريم','سلمى','حسن','ندى','يوسف','ليلى','طارق'] : ['Mona','Omar','Karim','Salma','Hassan','Nada','Youssef','Laila','Tarek']; }
function addBot(){ const used = host.P.map(p=>p.name); const n = botNames().find(x=>!used.includes(x+' 🤖')) || 'Bot'; host.add('bot'+rid(4), n+' 🤖', true); }
function startSolo(){
  if(!need()) return;
  solo = true; U.code = 'SOLO'; IN = {};
  host = new Host('SOLO', me, true); host.add(me, U.name, false);
  for(let i=0;i<5;i++) addBot();
  startHostLoop();
}
function leave(){
  clearInterval(hostTimer);
  if(!solo) netClose(true);
  store.set('wsy_room','');

  if(need==='H'){ const h = myHand(); body += `<span class="sec-t">${t('abWhich')}</span><div class="row center">${h.map((c,i)=>`<button class="slotbtn ${sel.i===i?'selc':''}" data-act="abi" data-i="${i}">${card(c, sel.i===i?'sel':'')}</button>`).join('')}</div>`; }
  const ready = (!need.includes('T') || sel.t) && (!need.includes('Q') || sel.q!=null) && (!(need==='I'||need==='H') || sel.i!=null);
  return `<div class="sec">${backBtn()}${abCard(k, false, true)}${body}<button class="btn gold lg block" data-act="abdo" data-k="${k}" ${ready?'':'disabled'}>${t('useAb')} ${ABI[k]}</button></div>`;
}
function introView(){
  const pv = S.pv?.[me];
  const ev = S.evk ? `<div class="stage evstage"><div class="big">${EVI[S.evk]}</div><span class="lbl">${t('evThis')}</span><h2>${t('EV_'+S.evk)}</h2><p>${t('EVD_'+S.evk)}</p></div>` : `<div class="stage"><div class="big">🔐</div><h2>${t('normalRound')}</h2><p class="muted">${t('normalRoundS')}</p></div>`;
  const revs = (S.revs||[]).map(id=>`<div class="event">👻 ${t('revived',{p:nm(id)})}</div>`).join('');
  const abs = pv && pv.ab && pv.ab.length ? `<div class="sec"><span class="sec-t">✨ ${pv.ab.length>1?t('yourAbs'):t('yourAb')}</span>${pv.ab.map(k=>abCard(k,false,true)).join('')}<p class="small muted">${t('abIntro')}</p></div>` : '';
  return ev + revs + abs + hostNext();
}

/* ---- accuse ---- */
function accuseView(){
  const mp = meP();
  if(!isAlive(mp)) return ghostBlock();
  const done = IN.dn===S.r, opened = mp[3]&(2|4|512);
  if(opened) return `<div class="sec"><div class="waitbox"><div class="bigemoji">⏳</div><p>${t('doneW')}</p></div></div>`;
  return `<div class="sec"><span class="sec-t">⭐ ${t('guessT')}</span><p class="small muted">${t('guessS')}</p>
    ${pickSlots()}<p class="small muted center">${t('pickHelp')}</p>${pickGrid()}</div>`
    + (done ? `<p class="saved center">${t('doneW')}</p>` : `<button class="btn gold lg block" data-act="done">${t('done')}</button>`) + sideTabsLogOnly();
}
function sideTabsLogOnly(){ const turns = [...new Set([...S.lg.map(l=>l[0]), ...S.ev.map(e=>e[2])])].sort((a,b)=>b-a);
  return turns.length ? `<div class="sec"><span class="sec-t">${t('tLog')}</span><div class="log">${turns.map(n=>`<span class="turnlbl">${t('turnN',{n})}</span>${S.lg.map((l,ix)=>[l,ix]).filter(([l])=>l[0]===n).map(([l,ix])=>logItem(l,ix)).join('')}${(S.pkp||[]).filter(p=>p[0]===n).map(pkItem).join('')}${(S.mutes||[]).filter(m=>m[0]===n).map(m=>`<div class="event">${t('muted',{p:nm(m[1])})}</div>`).join('')}${S.ev.filter(e=>e[2]===n).map(evItem).join('')}`).join('')}</div></div>` : ''; }

/* ---- results ---- */
function resultsView(){
  const res = S.res || [];
  const top = [...res].sort((a,b)=>b[1]-a[1]).slice(0,3);
  const order = [top[1], top[0], top[2]];
  const cls = ['p2','p1','p3'];
  const podium = `<div class="podium">${order.map((r,i)=> r ? `<div class="pod ${cls[i]}">${avatar(r[0], i===1?'lg':'')}<span class="nm">${nm(r[0])}</span><div class="blk">${r[1]>0?'+':''}${r[1]}</div></div>` : '<div></div>').join('')}</div>`;
  const alive = S.P.filter(isAlive).sort((a,b)=>a[2]-b[2]);
  const minTot = alive[0]?.[2];
  const rows = [...res].sort((a,b)=>P(b[0])[2]-P(a[0])[2]).map(r=>{ const [id, rp, rank, c, acc, liar, gh, beq] = r; const x = P(id), f = x[3];
    const tags = [ (f&2)?t('opened'):(f&512)?t('halfO'):(f&4)?t('wrongO'):t('correctN',{n:c}), acc?`${t('t_acc')} ${acc>0?'+':''}${acc}`:'', liar?`${t('t_liar')} +${liar}`:'', gh?`${t('t_gh')} ${gh>0?'+':''}${gh}`:'', beq?`${t('t_beq')} +${beq}`:'' ].filter(Boolean).join(' · ');
    const danger = x[2]===minTot;
    return `<div class="lrow ${danger?'danger':''} ${id===me?'me':''}">${avatar(id,'sm')}<div style="min-width:0"><b>${esc(x[1])}</b>${danger?` <span class="small" style="color:#d0233a">⚠️ ${t('danger')}</span>`:''}<div class="tags">${tags}</div></div><span class="delta ${rp>0?'p':rp<0?'m':'z'} num">${rp>0?'+':''}${rp}</span><span class="tot num">${x[2]}</span></div>`; }).join('');
  return `<div class="sec">${podium}</div>
   ${S.fk?`<div class="event">🎰 ${t('fakeWas')} “${hintText(S.fk)}”</div>`:''}
   ${S.lv?`<div class="sec center"><span class="lbl">${t('vaultWas')}</span><div class="row center">${S.lv.map(c=>card(c,'flip')).join('')}</div></div>`:''}
   <div class="col">${rows}</div>${hostNext()}`;
}

/* ---- court ---- */
function courtView(){
  const ct = S.ct; if(!ct) return '';
  const inCourt = ct.d.includes(me);
  const canVote = !inCourt && (!ct.w || !isAlive(meP()));
  const vt = IN.vt && IN.vt.k===ct.k ? IN.vt.t : null;
  const voting = S.ph==='vote' && canVote;
  const defs = `<div class="defs">${ct.d.map(id=> voting ? `<button class="def ${vt===id?'sel':''}" data-act="vote" data-t="${id}">${avatar(id,'lg')}<b>${nm(id)}</b><span class="num muted small">${P(id)?.[2]} ${t('pts')}</span></button>` : `<div class="def">${avatar(id,'lg')}<b>${nm(id)}</b><span class="num muted small">${P(id)?.[2]} ${t('pts')}</span></div>`).join('')}</div>`;
  let foot = '';
  if(S.ph==='talk') foot = (inCourt?`<p class="sec-t" style="color:#d0233a">${t('youDefend')}</p>`:'') + hostNext();
  else if(voting) foot = `<p class="sec-t">${ct.w?t('voteWin'):t('voteOut')}</p>${vt?`<p class="saved">${t('voted')}</p>`:''}`;
  else foot = `<p class="muted">${t('waitVote')}</p>`;
  return `<div class="stage"><div class="big">⚖️</div>${defs}${foot}</div>`;
}

/* ---- wills ---- */
function resText(c){
  const [k, tt, t2, ok, a] = c;
  if(!ok) return t('fail');
  const m = {t:tt?`<b>${nm(tt)}</b>`:'', t2:t2?`<b>${nm(t2)}</b>`:'', a:`<b class="num">${a}</b>`};
  const map = {give:'R_give', asker:'R_give', above:'R_give', first:'R_first', revive:'R_revive', minus:'R_minus', skip:'R_skip', take:'R_take', swap:'R_swap', expose:'R_expose', cancel:'R_cancel'};
  return t(map[k], m);
}
function willsView(){
  return (S.el||[]).map((it,i)=>{
    let body;
    if(it.none) body = `<p>${t('noWill')}</p>`;
    else if(it.cancelled) body = `<p class="no"><b>${t('cancelledW')}</b></p>`;
    else body = it.cl.map(c=>`<div class="res"><span class="mk ${c[3]?'ok':'no'}">${c[3]?'✓':'✗'}</span><div><div>${willSentence(c[0], ['asker','above','revive'].includes(c[0])?null:c[1], c[2])}</div><div class="sub">${resText(c)}</div>
      ${c[0]==='expose'&&c[3]?`<div class="sub">${t('exposed',{p:nm(c[1])})} ${(c[5]||[]).map(e=>willSentence(e[0],e[1],e[2])).join(' + ')||t('noWill')}${c[6]?` — “${esc(c[6])}”`:''}</div>`:''}</div></div>`).join('') || `<p>${t('noWill')}</p>`;
    return `<div class="will-out" style="animation-delay:${i*0.6}s"><h3>${avatar(it.id)} ${t('outMsg',{p:nm(it.id)})}</h3>${body}${it.x?`<p><b>${t('freeW')}</b> “${esc(it.x)}”</p>`:''}</div>`;
  }).join('') + hostNext();
}

/* ---- over ---- */
function overView(){
  const sorted = [...S.P].sort((a,b)=> (b[0]===S.win)-(a[0]===S.win) || (b[3]&1)-(a[3]&1) || b[2]-a[2]);
  return `<div class="stage"><div class="big">🏆</div>${avatar(S.win,'lg')}<h2 style="font-size:2.2rem">${nm(S.win)}</h2>
    ${S.lv?`<div class="row center">${S.lv.map(c=>card(c)).join('')}</div>`:''}</div>
   <div class="sec"><span class="sec-t">${t('standings')}</span>${sorted.map((x,i)=>`<div class="lrow ${x[0]===me?'me':''}"><span class="num muted">${i+1}</span><div class="row">${avatar(x[0],'sm')}<b>${esc(x[1])}</b></div><span class="small muted">${x[0]===S.win?'🏆':(x[3]&1)?'':t('out')}</span><span class="tot num">${x[2]}</span></div>`).join('')}</div>
   ${isHost()?`<button class="btn gold lg block" data-act="newgame">${t('newGame')} 🎲</button>`:''}`;
}

/* ---- overlays ---- */
function helpView(){
  const H = T[lang].help, i = Math.min(U.helpI, H.length-1), [ic, h, p] = H[i];
  return `<div class="ov" data-act="helpbg"><div class="ovc" role="dialog" aria-modal="true"><div class="big">${ic}</div><h2>${h}</h2><p>${p}</p>
    <div class="sdots">${H.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" data-act="helpclose">${t('helpSkip')}</button>
    ${i<H.length-1?`<button class="btn gold" data-act="helpnext">${t('helpNext')}</button>`:`<button class="btn gold" data-act="helpclose">${t('helpDone')}</button>`}</div></div></div>`;
}
function confettiView(){ const cols = AVC; let s=''; for(let i=0;i<40;i++) s += `<i style="left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${Math.random()*1.2}s"></i>`; return `<div class="confetti">${s}</div>`; }

/* ============ events ============ */
app.addEventListener('input', e=>{
  const b = e.target.dataset.bind;
  if(b==='name') U.name = e.target.value;
  else if(b==='code') U.code = e.target.value.toUpperCase();
  else if(b==='willx'){ U.draft.x = e.target.value; saveWill(); }
});
app.addEventListener('keydown', e=>{ if(e.key==='Enter'){ if(e.target.id==='in-code') joinRoom(); else if(e.target.id==='in-name') createRoom(); } });
app.addEventListener('change', e=>{ if(e.target.id==='wx') render(); });
app.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, d = el.dataset;
  if(act==='helpbg' && e.target!==el) return;
  switch(act){
    case 'lang': lang = lang==='ar'?'en':'ar'; store.set('wsy_lang', lang); render(); break;
    case 'help': U.help = true; U.helpI = 0; render(); break;
    case 'helpnext': U.helpI++; render(); break;
    case 'helpclose': case 'helpbg': U.help = false; render(); break;
    case 'create': createRoom(); break;
    case 'join': joinRoom(); break;
    case 'joinopen': if(/^[A-Z]{4}$/.test(d.c||'')){ U.code = d.c; joinRoom(); } break;
    case 'pubtoggle': U.pubRoom = !U.pubRoom; cmd('pub', U.pubRoom); render(); break;
    case 'solo': startSolo(); break;
    case 'leave': leave(); break;
    case 'copy': { const done=()=>{U.copied=true; render(); setTimeout(()=>{U.copied=false; render();},1500);}; try{ navigator.clipboard.writeText(S.c).then(done, ()=>{}); }catch(_){} break; }
    case 'addbot': if(solo && host){ addBot(); } else cmd('addbot', lang); break;
    case 'start': if(solo && host) host.start(); else cmd('start'); break;
    case 'newgame': IN={}; if(solo && host){ host.resetGame(); host.ph='lobby'; setIn({}); } else { setIn({}); cmd('newgame'); } break;
    case 'next': setIn({nx:S.k}); break;
    case 'wpick': { const k = d.k; if(U.draft.c.length>=2 || (GIVE.includes(k) && U.draft.c.some(x=>GIVE.includes(x[0]))) || U.draft.c.some(x=>x[0]===k)) break; if(NEEDT[k]) U.pendingW = [k, null]; else { U.draft.c.push([k,null,null]); saveWill(); } render(); break; }
    case 'wtarget': { const [k, t1] = U.pendingW; if(NEEDT[k]===2 && !t1){ U.pendingW = [k, d.t]; } else { U.draft.c.push([k, t1||d.t, t1?d.t:null]); U.pendingW = null; saveWill(); } render(); break; }
    case 'wready': setIn({wd: IN.wd ? null : 1}); saveWill(); render(); break;
    case 'wcancel': U.pendingW = null; render(); break;
    case 'wdel': U.draft.c.splice(+d.i,1); saveWill(); render(); break;
    case 'sheet': U.sheet = d.v; U.mode = null; render(); break;
    case 'closesheet': U.sheet = null; U.mode = null; render(); break;
    case 'mode': U.sheet = null; U.mode = d.v || null; U.selPeek=null; if(U.mode==='ask'){U.askT=null;U.askQ=null;} render(); break;
    case 'selpeek': U.selPeek = +d.i; render(); break;
    case 'dopeek': if(U.selPeek!=null){ setIn({a:{r:S.r, tn:S.tn, k:'p', i:U.selPeek}}); U.mode=null; render(); } break;
    case 'askt': U.askT = d.t; render(); break;
    case 'askq': U.askQ = +d.q; render(); break;
    case 'doask': if(U.askT!=null && U.askQ!=null){ setIn({a:{r:S.r, tn:S.tn, k:'q', t:U.askT, q:U.askQ}}); U.mode=null; render(); } break;
    case 'pass': setIn({a:{r:S.r, tn:S.tn, k:'n'}}); render(); break;
    case 'lie': { const pv = S.pv?.[me]; if(!pv || pv.lu) break; const on = IN.lie && IN.lie.r===S.r && IN.lie.n===pv.lc; setIn({lie: on ? null : {r:S.r, n:pv.lc}}); render(); break; }
    case 'side': U.side = d.v; render(); break;
    case 'nmode': U.noteMode = d.v; render(); break;
    case 'abgo': U.mode = 'ab:'+d.k; U.abSel = {}; if(d.k==='tabdeel' && myHand().length===1) U.abSel.i = 0; if(!ABNEED[d.k]){ const au = (IN.au && IN.au.r===S.r) ? {...IN.au} : {r:S.r}; au[d.k] = {}; setIn({au}); U.mode = null; U.sheet = 'abs'; } render(); break;
    case 'abt': U.abSel.t = d.t; render(); break;
    case 'abq': U.abSel.q = +d.q; render(); break;
    case 'abi': U.abSel.i = +d.i; render(); break;
    case 'abdo': { const au = (IN.au && IN.au.r===S.r) ? {...IN.au} : {r:S.r}; au[d.k] = {...U.abSel}; setIn({au}); U.mode = null; U.abSel = {}; U.sheet = 'abs'; render(); break; }
    case 'answer': if(S.pend){ setIn({ans:{k:S.pend.k, v:+d.v}}); U.lieMode = false; render(); } break;
    case 'liemode': U.lieMode = !U.lieMode; render(); break;
    case 'pick': { const c = +d.c; const k = U.pick.indexOf(c); if(k>=0) U.pick.splice(k,1); else if(U.pick.length<3) U.pick.push(c); setIn({g:[...U.pick]}); render(); break; }
    case 'unpick': { const k = U.pick.indexOf(+d.c); if(k>=0) U.pick.splice(k,1); setIn({g:[...U.pick]}); render(); break; }
    case 'toconfirm': if(U.pick.length===3){ U.mode='confirm'; render(); } break;
    case 'note': { const c = +d.c; if(U.notes[c]===1) delete U.notes[c]; else U.notes[c]=1; render(); break; }
    case 'note_old': { const c = +d.c, m = d.m, st = U.notes[c]||0;
      if(m==='x'){ if(st===1) delete U.notes[c]; else U.notes[c]=1; }
      else { if(st===2) delete U.notes[c]; else if(stars().length<3) U.notes[c]=2; }
      setIn({g:stars()}); render(); break; }
    case 'doopen': { const g = [...U.pick]; if(g.length===3){ setIn({o:{r:S.r, g}}); U.mode=null; render(); } break; }
    case 'acc': setIn({ac: d.t ? {r:S.r, t:d.t} : null}); render(); break;
    case 'done': setIn({dn:S.r, g:[...U.pick]}); render(); break;
    case 'vote': setIn({vt:{k:S.ct.k, t:d.t}}); render(); break;
    case 'ghost': if(!(IN.gh && IN.gh.r===S.r)){ setIn({gh:{r:S.r, t:d.t, s:+d.s}}); render(); } break;
  }
});
function tickTimer(){
  const el = document.getElementById('timer'); if(!el) return;
  const ms = remMs(), s = Math.ceil(ms/1000);
  el.textContent = s;
  const ring = document.getElementById('ring'), fg = document.getElementById('ringfg');
  if(fg) fg.setAttribute('stroke-dashoffset', String(144.5 * (1 - Math.min(1, ms/U.phaseDur))));
  if(ring) ring.classList.toggle('low', s<=5);
}
setInterval(tickTimer, 250);
applyLang(); render();
if(!store.get('wsy_seenhelp')){ U.help = true; store.set('wsy_seenhelp','1'); render(); }
window.__wsy = {get S(){return S;}, get host(){return host;}, IN:()=>IN, U};

})();
</script>
</body>
